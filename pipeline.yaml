pipelineInfo:
  name: inference-pipeline
root:
  dag:
    tasks:
      data-drift:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-drift
        dependentTasks:
        - load-data
        - load-data-2
        inputs:
          artifacts:
            current_features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: load-data-2
            reference_features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: load-data
          parameters:
            project_id:
              componentInputParameter: project_id
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: Data Drift
      data-quality:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-quality
        dependentTasks:
        - load-data
        - load-data-2
        inputs:
          artifacts:
            current_features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: load-data-2
            reference_features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: load-data
          parameters:
            project_id:
              componentInputParameter: project_id
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: Data Quality
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data
        inputs:
          parameters:
            dataset_uri:
              componentInputParameter: reference_dataset_uri
        taskInfo:
          name: Load Reference Data
      load-data-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data-2
        inputs:
          parameters:
            dataset_uri:
              componentInputParameter: churn_dataset_uri
        taskInfo:
          name: Load Current Data
      post-process:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-post-process
        dependentTasks:
        - load-data-2
        - predict
        inputs:
          artifacts:
            features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: load-data-2
            predictions:
              taskOutputArtifact:
                outputArtifactKey: predictions
                producerTask: predict
            target:
              taskOutputArtifact:
                outputArtifactKey: target
                producerTask: load-data-2
        taskInfo:
          name: Post Process
      predict:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-predict
        dependentTasks:
        - load-data-2
        inputs:
          artifacts:
            features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: load-data-2
          parameters:
            model_name:
              componentInputParameter: model_name
            tracking_uri:
              componentInputParameter: tracking_uri
        taskInfo:
          name: Predict Current
      predict-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-predict-2
        dependentTasks:
        - load-data
        inputs:
          artifacts:
            features:
              taskOutputArtifact:
                outputArtifactKey: features
                producerTask: load-data
          parameters:
            model_name:
              componentInputParameter: model_name
            tracking_uri:
              componentInputParameter: tracking_uri
        taskInfo:
          name: Predict Reference
      prediction-drift:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prediction-drift
        dependentTasks:
        - predict
        - predict-2
        inputs:
          artifacts:
            current_target:
              taskOutputArtifact:
                outputArtifactKey: predictions
                producerTask: predict
            reference_target:
              taskOutputArtifact:
                outputArtifactKey: predictions
                producerTask: predict-2
          parameters:
            project_id:
              componentInputParameter: project_id
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: Target Drift
  inputDefinitions:
    parameters:
      churn_dataset_uri:
        defaultValue: gs://churn-datasets-mlops-training/churn_data_2025_05.csv
        parameterType: STRING
